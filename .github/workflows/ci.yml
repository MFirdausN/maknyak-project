name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm security:audit
      - run: docker compose config --quiet

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATEWAY_HOST_PORT: 13000
      IDENTITY_HOST_PORT: 13001
      WORKSPACE_HOST_PORT: 13002
      DASHBOARD_HOST_PORT: 13003
      KEYCLOAK_HOST_PORT: 18080
      POSTGRES_HOST_PORT: 15432
      REDIS_HOST_PORT: 16379
      NATS_HOST_PORT: 14222
      NATS_MONITOR_HOST_PORT: 18222
      MINIO_HOST_PORT: 19000
      MINIO_CONSOLE_HOST_PORT: 19001
      OIDC_ISSUER: http://localhost:18080/realms/maknyak
      INTERNAL_API_KEY: ci-integration-only-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build runtime image
        run: docker build --tag maknyak-platform-runtime:latest .
      - name: Start stack
        run: |
          if ! docker compose up --detach --wait --wait-timeout 300; then
            docker compose ps --all
            state="$(docker compose ps --all --format json | jq --compact-output --slurp '.')"
            echo "::error title=Compose startup failed::${state}"
            exit 1
          fi
      - name: Verify migration replay
        run: docker compose run --rm migrate
      - name: Run end-to-end smoke test
        run: make smoke
      - name: Run Phase 1 tenant isolation test
        run: make phase1-test
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
