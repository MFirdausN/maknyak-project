name: maknyak-platform

services:
  gateway:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/gateway/dist/src/main.js"]
    environment:
      GATEWAY_PORT: 3000
      IDENTITY_URL: http://identity:3001
      WORKSPACE_URL: http://workspace:3002
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/maknyak}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/maknyak/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-maknyak-cli}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    ports:
      - "${GATEWAY_HOST_PORT:-3000}:3000"
    depends_on:
      identity:
        condition: service_healthy
      workspace:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  identity:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/identity/dist/src/main.js"]
    environment:
      IDENTITY_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-maknyak}:${POSTGRES_PASSWORD:-maknyak_local}@postgres:5432/${POSTGRES_DB:-maknyak}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    ports:
      - "${IDENTITY_HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/workspace/dist/src/main.js"]
    environment:
      WORKSPACE_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-maknyak}:${POSTGRES_PASSWORD:-maknyak_local}@postgres:5432/${POSTGRES_DB:-maknyak}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    ports:
      - "${WORKSPACE_HOST_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-maknyak}
      PGUSER: ${POSTGRES_USER:-maknyak}
      PGPASSWORD: ${POSTGRES_PASSWORD:-maknyak_local}
    volumes:
      - ./infrastructure/postgres/init:/migrations:ro
    command:
      [
        "sh",
        "-c",
        "for file in /migrations/*.sql; do psql --set ON_ERROR_STOP=1 --file $$file; done",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maknyak}
      KC_DB_USERNAME: ${POSTGRES_USER:-maknyak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-maknyak_local}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:MaxRAMPercentage=65"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    restart: unless-stopped

  dashboard:
    image: maknyak-platform-runtime:latest
    command:
      [
        "node",
        "applications/dashboard/node_modules/next/dist/bin/next",
        "start",
        "applications/dashboard",
        "-p",
        "3003",
      ]
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_HOST_PORT:-3000}
    ports:
      - "${DASHBOARD_HOST_PORT:-3003}:3003"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maknyak}
      POSTGRES_USER: ${POSTGRES_USER:-maknyak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maknyak_local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "${NATS_HOST_PORT:-4222}:4222"
      - "${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maknyak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maknyak_local_secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.3
    profiles: ["ai"]
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["ai"]
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  qdrant-data:
  ollama-data:
