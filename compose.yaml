name: maknyak-platform

services:
  gateway:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/gateway/dist/src/main.js"]
    environment:
      GATEWAY_PORT: 3000
      IDENTITY_URL: http://identity:3001
      WORKSPACE_URL: http://workspace:3002
      AI_URL: http://ai:3004
      REDIS_URL: redis://redis:6379
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/maknyak}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/maknyak/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-maknyak-cli}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    init: true
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3000}:3000"
    depends_on:
      identity:
        condition: service_healthy
      workspace:
        condition: service_healthy
      ai:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  identity:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/identity/dist/src/main.js"]
    environment:
      IDENTITY_PORT: 3001
      DATABASE_URL: postgresql://${IDENTITY_DB_USER:-maknyak_identity}:${IDENTITY_DB_PASSWORD:-identity_local}@postgres:5432/${POSTGRES_DB:-maknyak}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    init: true
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace:
    image: maknyak-platform-runtime:latest
    command: ["node", "platform/workspace/dist/src/main.js"]
    environment:
      WORKSPACE_PORT: 3002
      DATABASE_URL: postgresql://${WORKSPACE_DB_USER:-maknyak_workspace}:${WORKSPACE_DB_PASSWORD:-workspace_local}@postgres:5432/${POSTGRES_DB:-maknyak}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
    init: true
    ports:
      - "127.0.0.1:${WORKSPACE_HOST_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  ai:
    image: maknyak-platform-runtime:latest
    command: ["node", "services/ai/dist/src/main.js"]
    environment:
      AI_PORT: 3004
      DATABASE_URL: postgresql://${AI_DB_USER:-maknyak_ai}:${AI_DB_PASSWORD:-ai_local}@postgres:5432/${POSTGRES_DB:-maknyak}
      WORKSPACE_URL: http://workspace:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-every-environment}
      OLLAMA_URL: http://ollama:11434
      AI_ENABLE_OLLAMA: ${AI_ENABLE_OLLAMA:-false}
    init: true
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-3004}:3004"
    depends_on:
      migrate:
        condition: service_completed_successfully
      workspace:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3004/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-maknyak}
      PGUSER: ${POSTGRES_USER:-maknyak}
      PGPASSWORD: ${POSTGRES_PASSWORD:-maknyak_local}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-maknyak_identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
      WORKSPACE_DB_USER: ${WORKSPACE_DB_USER:-maknyak_workspace}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:-workspace_local}
      AI_DB_USER: ${AI_DB_USER:-maknyak_ai}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai_local}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-maknyak_keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
    volumes:
      - ./infrastructure/postgres/init:/migrations:ro
      - ./infrastructure/postgres/migrate.sh:/usr/local/bin/maknyak-migrate:ro
    command: ["sh", "/usr/local/bin/maknyak-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maknyak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-maknyak_keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:MaxRAMPercentage=65"
    init: true
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    restart: unless-stopped

  dashboard:
    image: maknyak-platform-runtime:latest
    command:
      [
        "node",
        "applications/dashboard/node_modules/next/dist/bin/next",
        "start",
        "applications/dashboard",
        "-p",
        "3003",
      ]
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_HOST_PORT:-3000}
      DASHBOARD_PUBLIC_URL: http://localhost:${DASHBOARD_HOST_PORT:-3003}
      GATEWAY_INTERNAL_URL: http://gateway:3000
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/maknyak}
      OIDC_TOKEN_URL: http://keycloak:8080/realms/maknyak/protocol/openid-connect/token
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-maknyak-cli}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    init: true
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3003}:3003"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maknyak}
      POSTGRES_USER: ${POSTGRES_USER:-maknyak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maknyak_local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maknyak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maknyak_local_secret}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.3
    profiles: ["ai"]
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["ai"]
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  qdrant-data:
  ollama-data:
